# project.conf: the only file you have to edit to point the tooling at YOUR Moodle.
#
# This is the template in the kit (templates/project/project.conf). Onboarding
# copies it to project/project.conf, which is the copy the kit's tools read and
# the one you edit. It belongs to your project, not the kit. Fill it in once,
# after you have run SETUP.md and created your courses and question banks. The
# setup scripts print every number you need here.
#
# This is a shell file: no spaces around "=", quote anything with spaces.

# ---------------------------------------------------------------------------
# Docker containers
# ---------------------------------------------------------------------------

# The Moodle container that serves your live/authoring site.
LIVE_CONTAINER=moodle-docker-webserver-1

# The Moodle database container (used only for ad-hoc SQL lookups).
DB_CONTAINER=moodle-docker-db-1
DB_NAME=moodle
DB_USER=root
DB_PASS=m@0dl3ing

# Base URL of your Moodle site.
MOODLE_URL=http://localhost:8000

# Optional second Moodle stack, used to validate while a push runs on the
# first one. Leave blank if you only have one.
SANDBOX_CONTAINER=
SANDBOX_CATEGORYID=
SANDBOX_CONTEXTID=

# ---------------------------------------------------------------------------
# Sandbox question bank: where validation imports land ("dev" course)
# Printed by tools/setup-workspace.php
# ---------------------------------------------------------------------------

DEV_CATEGORYID=
DEV_CONTEXTID=

# ---------------------------------------------------------------------------
# Review question bank and preview quiz: where drafts go for human eyeballing
# All four are printed by tools/setup-workspace.php.
# ---------------------------------------------------------------------------

REVIEW_CATEGORYID=
REVIEW_CONTEXTID=
REVIEW_QUIZID=
REVIEW_QUIZ_CMID=

# ---------------------------------------------------------------------------
# Live courses: one line per course you publish to.
#
#   COURSES="key:courseid:categoryid:contextid:Label"
#
# "key" is what you pass to --course= on the command line. Add as many as you
# like, separated by spaces. Example with two courses:
#
#   COURSES="alg:7:296:114:Algebra_1 calc:12:410:198:Calculus"
#
# (No spaces inside a label; use underscores.)
# ---------------------------------------------------------------------------

COURSES=""

# Which key to use when --course= is not given.
DEFAULT_COURSE=
