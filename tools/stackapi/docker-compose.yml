# Standalone STACK REST API + goemaxima CAS, for validating/grading our
# Moodle-XML questions WITHOUT a Moodle DB import. See tools/api-check.sh.
#
#   docker compose -f tools/stackapi/docker-compose.yml -p stackapi up -d
#
# The images are amd64-only; `platform: linux/amd64` runs them under Rosetta
# emulation on Apple Silicon. config.php is mounted to raise castimeout (the
# stock 10s times out under emulation). API listens on http://localhost:3080.
services:
  maxima:
    platform: linux/amd64
    # The version comes from STACK_VERSION in tools/stackapi/.env, which is
    # machine-local and not in git (see .env.example and SETUP.md). It must be
    # the STACK version installed in YOUR Moodle: question/type/stack/version.php
    # ($plugin->version). rand() sequences and grading change between STACK
    # versions, so a mismatch can cause false fails, or pass while grading
    # differently. GOEMAXIMA_BUILD, also in .env, pins an exact build of that
    # version; it defaults to latest, which a publisher can point at a broken
    # build.
    image: mathinstitut/goemaxima:${STACK_VERSION:?Set STACK_VERSION in tools/stackapi/.env, see SETUP.md}-${GOEMAXIMA_BUILD:-latest}
    tmpfs:
      - "/tmp"
    restart: unless-stopped
    cap_add:
      - SETGID
      - SETUID
    cap_drop:
      - ALL
    environment:
      GOEMAXIMA_QUEUE_LEN: 32
    read_only: true
  stack:
    platform: linux/amd64
    # STACKAPI_IMAGE defaults to the published image. Where Docker Hub has none
    # for your version, build one and set STACKAPI_IMAGE=stackapi-local in .env:
    # see SETUP.md, "Build the API image". STACKAPI_BUILD pins an exact build,
    # as GOEMAXIMA_BUILD does above.
    image: ${STACKAPI_IMAGE:-stackmaths/stackapi}:${STACK_VERSION:?Set STACK_VERSION in tools/stackapi/.env, see SETUP.md}-${STACKAPI_BUILD:-latest}
    restart: unless-stopped
    environment:
      STACK_VERSION: ${STACK_VERSION}
    volumes:
      - ./config.php:/srv/stack/api/config.php:ro
    ports:
      - '3080:80'
